name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: nproc; lscpu | head -20; node --version
      - run: node probe/bench.ts $PWD/packages/core/src 4
      - run: node --cpu-prof --cpu-prof-dir=probe/prof probe/bench.ts $PWD/packages/core/src 3
      - run: node --single-threaded probe/bench.ts $PWD/packages/core/src 3
      - uses: actions/upload-artifact@v7
        with:
          name: perf-probe
          path: probe/prof
      - run: exit 1
      - run: pnpm lint
      - run: pnpm lint:art
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chrome
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: e2e/.results
